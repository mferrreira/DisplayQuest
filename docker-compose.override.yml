# Publica o Postgres no LOOPBACK do host (127.0.0.1:5432) para `psql` local e para o
# `tests/integration/entities-roundtrip.test.ts`. A base (docker-compose.yml) usa apenas
# `expose`, que nao publica porta no host — so intra-rede `app -> postgres:5432`.
#
# IMPORTANTE — este override e versionado e entra SEMPRE, tambem em producao: o Docker
# Compose carrega `docker-compose.override.yml` implicitamente por convencao de nome,
# sem comando que o nomeie. (O comentario anterior deste arquivo dizia para subir em
# prod "SEM este override" — isso era falso e induzia a erro.) Ele e seguro em prod
# porque amarra apenas em 127.0.0.1, nunca em 0.0.0.0. Para debug remoto, prefira
# `ssh -L 5432:localhost:5432 <host>` a abrir a porta no host.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # V5-1 (DEC-101): o bucket não precisa estar no ar para a suíte passar (o seam é testado
  # com cliente injetado), mas estas portas deixam testar o SDK do host e inspecionar o
  # conteúdo no navegador. Loopback puro — mesma postura da 5432 acima.
  seaweedfs:
    ports:
      - "127.0.0.1:8333:8333" # API S3
      - "127.0.0.1:8888:8888" # Filer UI
